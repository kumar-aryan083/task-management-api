services:
  postgres:
    image: postgres:16-alpine
    container_name: task-management-api-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_management_api
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d task_management_api']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
